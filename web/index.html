<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Aparte regex-highlighter</title>
    <meta name="description" content="regex-highlighter">
    <link href="https://fonts.googleapis.com/css?family=Source+Sans+Pro" rel="stylesheet">
    <link rel="stylesheet" href="bundle.css">
    <link rel="stylesheet" href="tooltip.css">
  </head>
  <body>
    <div class="regexTopContainer">
        <div class="regexPrefix">/</div>
        <div class="regexSuffix">/</div>
        <div class="regexContainer">
            <div id="regexBackground"></div>
            <div class="regexInputContainer">
                <textarea id="regexInput" wrap="hard" placeholder="regex goes here" autocorrect="off" autocapitalize="off" autocomplete="off" spellcheck="false"></textarea>
            </div>
            <div id="regexForeground"></div>
        </div>
      </div>
  </body>
  <script src="bundle.js"></script>
</html>
